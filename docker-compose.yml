services:
  tonearm-server:
    image: ghcr.io/brab-one/tonearm-server:latest
    container_name: tonearm-server
    restart: unless-stopped
    environment:
      # Navidrome as this container reaches it directly, not through the proxy.
      NAVIDROME_URL: http://192.168.1.11:4533
      # Has to match the custom location in Nginx Proxy Manager.
      BASE_PATH: /connect-tonearm
      # Optional, from the stack's .env; leave any out to skip it.
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      # The AI for AI picks: ollama, openai (anything with OpenAI's API) or claude. See the README.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_URL: ${AI_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # Ollama gets the model by itself when it's missing; off to leave that to you.
      AI_PULL: ${AI_PULL:-}
      # Still works for Ollama.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Only to bring a Maloja's history over once; remove after.
      MALOJA_URL: ${MALOJA_URL:-}
      MALOJA_API_KEY: ${MALOJA_API_KEY:-}
      MALOJA_USERS: ${MALOJA_USERS:-}
    ports:
      - "8790:8790"
    volumes:
      - tonearm-data:/data

volumes:
  tonearm-data:
